[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "multibest"
version = "0.1.0"
description = "Multi-modal materials science toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.4.4",
]

[project.scripts]
multibest-install-blender = "multibest.tools.install_blender:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"multibest.gui" = ["assets/icons/*.svg"]

[dependency-groups]
dev = [
    "commitizen>=4.5.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocs-minify-plugin>=0.8.0",
    "pre-commit>=4.5.1",
    "pysonar>=1.4.0.4676",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.9",
]
image_processing = [
    "opencv-python-headless>=4.8.0",
    "scikit-image>=0.22.0",
    "Pillow>=10.0.0",
    "scipy>=1.11.0",
]
image_to_mesh = [
    "pymeshlab>=2023.12",
]
gui = [
    "PySide6>=6.0.0",
    "vtk>=9.0.0",
    "matplotlib>=3.0.0",
    "periodictable>=1.6.0",
    "qtawesome>=1.3.0",
    "pyvista>=0.43.0",
    "pyvistaqt>=0.11.0",
]
input_convertor = [
    "ovito>=3.14.1,<3.15",
    "ase>=3.28.0",
]

mesh_to_atomistic = [
    "ase>=3.28.0",
    "gmsh>=4.13.0",
    "matplotlib>=3.0.0",
    "ovito>=3.14.1,<3.15",
    "pymeshlab>=2023.12",
    "scikit-image>=0.22.0",
    "scipy>=1.11.0",
    "tqdm>=4.66.0",
    "trimesh>=4.0.0",
    "rtree>=1.4.1",
]
ebsd_atomistic = [
    "ase>=3.28.0",
    "h5py>=3.10.0",
    "matplotlib>=3.0.0",
    "pandas>=2.0.0",
    "pymeshlab>=2023.12",
    "scikit-image>=0.22.0",
    "scipy>=1.11.0",
    "tqdm>=4.66.0",
    "trimesh>=4.0.0",
]
mesh_modification = [
    "trimesh>=4.0.0",
    "scipy>=1.11.0",
    "pyvista>=0.43.0",
    "pymeshfix>=0.17.0",
    "pymeshlab>=2023.12",
    "open3d>=0.18.0",
]

relaxation = [
    "ase>=3.28.0",
    "scipy>=1.16.0",
    "sevenn>=0.11.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]


[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
markers = [
    "gui: tests that require Qt dependency or display",
]

addopts = "--cov=src --cov-report=term"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "pyproject.toml:version",
]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true

[tool.coverage.run]
source = ["src"]
relative_files = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.xml]
output = "coverage.xml"
